name: Release

# Build installers for Windows, macOS and Linux and publish them to a
# GitHub Release. Triggered by pushing a tag like `v0.1.0`.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
          # Universal macOS binary covers both Apple Silicon and Intel Macs.
          - os: macos-latest
            args: "--target universal-apple-darwin"
            rustTargets: "aarch64-apple-darwin,x86_64-apple-darwin"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install Windows bundling tools (WiX + NSIS)
        if: matrix.os == 'windows-latest'
        run: |
          choco install wixtoolset nsis -y

      - name: Set WiX environment (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wix) { echo "WIX=$($wix.FullName)" >> $env:GITHUB_ENV }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Skill Manager ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install Skill Manager for your platform."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
