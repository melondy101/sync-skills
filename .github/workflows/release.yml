name: Release

# Build installers for Linux and Windows and collect them into a draft
# GitHub Release for manual publishing. Triggered by pushing a tag like
# `v0.3.0`. macOS is out of the matrix on purpose (see 4eeb791); tauri.conf.json
# still lists `app`/`dmg` as bundle targets, so re-adding a macos runner is the
# only thing between this file and a macOS artifact.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (only needed for manual dispatch)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # Run the same checks verify.yml runs before any installer is built,
  # so a tag cannot ship untested code.
  verify:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      # `bundle.externalBin` is validated by Tauri's build script on *every*
      # cargo invocation, and `src-tauri/bin/` is gitignored, so a fresh
      # checkout has nothing there and even `cargo check` fails. This writes a
      # placeholder to get cargo running; the real binary is staged by
      # `build.beforeBundleCommand` at bundling time.
      - name: Stage the sidecar binary path
        run: pnpm stage:sidecar

      - name: Frontend type check
        run: npx tsc --noEmit

      - name: Frontend tests
        run: pnpm test

      - name: Rust compile check
        run: cargo check
        working-directory: src-tauri

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri

  release:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: ""
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install Windows bundling tools (WiX + NSIS)
        if: matrix.os == 'windows-latest'
        run: |
          choco install wixtoolset nsis -y

      - name: Set WiX environment (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wix) { echo "WIX=$($wix.FullName)" >> $env:GITHUB_ENV }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      # `bundle.externalBin` is validated by Tauri's build script on *every*
      # cargo invocation, and `src-tauri/bin/` is gitignored, so a fresh
      # checkout has nothing there and even `cargo check` fails. This writes a
      # placeholder to get cargo running; the real binary is staged by
      # `build.beforeBundleCommand` at bundling time.
      - name: Stage the sidecar binary path
        run: pnpm stage:sidecar

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Skill Manager ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install Skill Manager for your platform."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
