name: Verify

# Run the checks CONTRIBUTING.md mandates before every commit:
# frontend type check, lint and unit tests, Rust compile check, clippy and unit tests.
# Push is limited to `main` so PR branches are not built twice.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      # `bundle.externalBin` is validated by Tauri's build script on *every*
      # cargo invocation, and `src-tauri/bin/` is gitignored, so a fresh
      # checkout has nothing there and even `cargo check` fails. This writes a
      # placeholder to get cargo running; the real binary is staged by
      # `build.beforeBundleCommand` at bundling time.
      - name: Stage the sidecar binary path
        run: pnpm stage:sidecar

      - name: Frontend type check
        run: npx tsc --noEmit

      - name: Frontend lint
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Rust compile check
        run: cargo check
        working-directory: src-tauri

      - name: Rust lint (clippy)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri
