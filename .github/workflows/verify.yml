name: Verify

# Run the checks CONTRIBUTING.md mandates before every commit:
# frontend type check, Rust compile check and Rust unit tests.
# Push is limited to `main` so PR branches are not built twice.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend type check
        run: npx tsc --noEmit

      - name: Rust compile check
        run: cargo check
        working-directory: src-tauri

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri
